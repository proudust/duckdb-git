[package]
name = "duckdb_git"
version = "0.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "duckdb-git"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[features]
default = ["loadable-extension", "libgit-backend"]
loadable-extension = ["duckdb/loadable-extension"]
bundled = ["duckdb/bundled"]                       # For benchmark
libgit-backend = ["dep:git2"]
# Additive: can be combined with libgit-backend (default) for runtime backend selection.
gix-backend = ["dep:gix", "gix/max-performance-safe", "gix/basic"]
# Record BlobRing hit/insert counters (off by default; type/reset/snapshot stay).
blob-ring-stats = []

[dependencies]
duckdb = { version = "~1.10505.0", features = ["vtab"] }
# Fork of git2-rs that vendors libgit2 with a 96 MB pack cache (git-like).
# https://github.com/proudust/git2-rs/tree/duckdb-git/pack-cache
git2 = { git = "https://github.com/proudust/git2-rs", branch = "duckdb-git/pack-cache", default-features = false, features = [
    "https",
    "vendored-libgit2",
    "vendored-openssl",
], optional = true }
gix = { version = "0.86", default-features = false, optional = true, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "sha1",
] }

[dev-dependencies]
divan = "0.1"
tempfile = "3"

[[bench]]
name = "git_log_with_duckdb"
harness = false

[[bench]]
name = "file_changes_insert"
harness = false

[[bench]]
name = "diff_phases"
harness = false

[[bench]]
name = "blob_ring_hits"
harness = false
required-features = ["libgit-backend", "blob-ring-stats"]
