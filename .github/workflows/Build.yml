name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # Tag pushes leave a detached HEAD with no refs/heads/*; unit tests that open
      # "." (contained, remote file:// clone) need a local branch tip.
      - name: Attach local branch for tests
        run: git symbolic-ref -q HEAD >/dev/null || git checkout -B main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Unit test
        run: cargo test --lib

      - name: Build
        run: make all

      - name: Test
        run: make test

  build-gix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Attach local branch for tests
        run: git symbolic-ref -q HEAD >/dev/null || git checkout -B main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Unit test (gix-backend)
        run: cargo test --lib --features gix-backend

      - name: Test (gix-backend)
        run: make test_gix
